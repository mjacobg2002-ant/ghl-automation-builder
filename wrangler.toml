name = "ghl-workflow-mcp"
main = "src/index.ts"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]

# ---------------------------------------------------------------------------
# Non-secret configuration. Safe to commit -- FIREBASE_API_KEY is a public
# Firebase Web API key (already embedded in GHL's own frontend bundle), not
# a credential. Actual secrets (refresh token, admin key) are set via
# `wrangler secret put` -- see README.md "Deploying" section.
# ---------------------------------------------------------------------------
[vars]
FIREBASE_API_KEY = "AIzaSyB_w3vXmsI7WeQtrIOkjR6xTRVN5uOieiE"
FIREBASE_PROJECT_ID = "highlevel-backend"
GHL_INTERNAL_BASE_URL = "https://backend.leadconnectorhq.com"
KV_TOKEN_KEY = "ghl_firebase_id_token"
KV_TOKEN_TTL_SECONDS = "3300"
# Optional: pre-fill so tools can omit `locationId`. Leave blank to require
# every tool call to pass locationId explicitly.
DEFAULT_LOCATION_ID = ""

# ---------------------------------------------------------------------------
# KV namespace used for the cached Firebase ID token (55-min TTL) and the
# persisted refresh token. Create with:
#   npx wrangler kv namespace create GHL_MCP_KV
#   npx wrangler kv namespace create GHL_MCP_KV --preview
# then replace the ids below with the ones it prints.
# ---------------------------------------------------------------------------
[[kv_namespaces]]
binding = "GHL_MCP_KV"
id = "REPLACE_WITH_KV_NAMESPACE_ID"
preview_id = "REPLACE_WITH_PREVIEW_KV_NAMESPACE_ID"
